services:
  benchmark:
    image: elixir-agent-benchmark:local
    build: .
    init: true
    network_mode: host
    environment:
      EAB_PREPARE_AHEAD: ${EAB_PREPARE_AHEAD:-4}
      EAB_PREPARE_WORKERS: ${EAB_PREPARE_WORKERS:-2}
      EAB_CACHE_MIN_FREE_GB: ${EAB_CACHE_MIN_FREE_GB:-5}
      EAB_OFFLINE: ${EAB_OFFLINE:-}
      EAB_TASKS_DIR: /tasks
    volumes:
      - benchmark-data:/data
      - ${EAB_TASKS_HOST_DIR:-./tasks}:/tasks
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  benchmark-data:
